<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Rajdhani:wght@500;600;700&family=Barlow+Semi+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&display=swap" rel="stylesheet" />
    <title>TJAtelier</title>
    <meta name="apple-mobile-web-app-title" content="TJAtelier" />
    <meta name="application-name" content="TJAtelier" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
      <!-- CSS が届く前から暗い背景にして、起動ロゴの前に白く光らないように -->
    <style>html, body { background: #14181b; }</style>
  </head>
  <body>
    <!-- 縦向きのときは #root ごと 90° 回転させて横画面で表示する（src/orient.ts） -->
    <div id="root">
    <!-- 起動のロゴ（読み込み中にエディタが見えないよう、最初から全体を覆う。曲えらびの準備ができたら帯が駆け抜けて消える） -->
    <div id="splash" class="splash" aria-hidden="true">
      <div class="spl-base"><i class="spl-st"></i>
        <div class="spl-bands"><i></i><i></i><i></i><i></i><i></i></div>
        <img class="spl-logo" src="logo.png" alt="" draggable="false"><i class="spl-line"></i>
        <div class="spl-glint" style="-webkit-mask-image:url(logo.png);mask-image:url(logo.png)"><i></i></div>
      </div>
      <div class="spl-exit"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div id="app">
      <div class="stage">
        <canvas id="editor"></canvas>
        <div id="tools" class="tools">
          <!-- ノーツ 4 つ（選んでいるボタンをもう一度タップすると、ドン⇔カッ・大ドン⇔大カッ・連打⇔大連打 が切り替わる） -->
          <div class="note-tools">
            <button data-group="small" class="tool" aria-label="ドン / カッ"><i></i></button>
            <button data-group="big" class="tool" aria-label="大ドン / 大カッ"><i></i></button>
            <button data-group="roll" class="tool" aria-label="連打 / 大連打"><i></i></button>
            <button data-group="balloon" class="tool" aria-label="風船"><i></i></button>
          </div>
          <!-- 命令: ゴーゴー（判定枠の炎の玉）、SCROLL・グラデ、BPMCHANGE、MEASURE -->
          <div class="cmd-tools">
            <button data-group="gogo" class="tool gogo" aria-label="ゴーゴータイム"><svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M24 9c6-3 9 1 13-2-1 6-2 11-6 17z" fill="#ee6e30"/>
              <circle cx="18" cy="22" r="14" fill="#f07436"/>
              <circle cx="18" cy="22" r="12" fill="none" stroke="#ffcf8a" stroke-width="1.2"/>
              <circle cx="18" cy="22" r="8" fill="#f3a35f" stroke="#ffe2a0" stroke-width="1.6"/>
            </svg></button>
            <button data-group="scroll" class="tool cmd scroll" aria-label="SCROLL・グラデ"><svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M4 13h9M2 20h11M4 27h9" stroke-width="2.4"/>
              <path d="M17 11l9 9-9 9M26 11l9 9-9 9" stroke-width="3.4"/>
            </svg></button>
            <button data-group="bpm" class="tool cmd bpm" aria-label="BPMCHANGE"><svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M2 22h8l4-11 6 20 5-14 3 5h10" stroke-width="3"/>
            </svg></button>
            <button data-group="measure" class="tool cmd measure" aria-label="MEASURE"><svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M7 4v32" stroke-width="2.6"/>
              <text x="24" y="18" text-anchor="middle">3</text>
              <text x="24" y="36" text-anchor="middle">4</text>
            </svg></button>
            <!-- 選択: 範囲を選んでコピー・切り取り・貼り付け -->
            <button data-group="select" class="tool cmd select" aria-label="選択"><svg viewBox="0 0 40 40" aria-hidden="true">
              <path d="M5 9h22v18H5z" stroke-width="2.6" stroke-dasharray="4 3.2"/>
              <path d="M22 20l13 5-6 2-2 6z" stroke-width="2.4" fill="#7cc4ff"/>
            </svg></button>
          </div>
          <!-- 音符の間隔（グリッド）: ‹ › で 1/8〜1/64、真ん中をタップで自由グリッド -->
          <div class="grid-step">
            <button id="divPrev" aria-label="間隔を広く"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
            <button id="divMid" aria-label="自由グリッド"><b id="divLabel">1/16</b></button>
            <button id="divNext" aria-label="間隔を細かく"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
          </div>
        </div>
        <!-- 今の位置の小節・BPM・拍子（波形の左下） -->
        <div id="posInfo" class="pos-info"><span><i>小節</i><b id="piBar">1</b></span><span><i>BPM</i><b id="piBpm">120</b></span><span><i>拍子</i><b id="piMeter">4/4</b></span></div>
        <!-- 拡大・縮小（波形の右上。密度レーンと反対側）。真ん中で元の大きさに -->
        <div id="zoomCtl" class="zoom-ctl">
          <button id="zoomIn" aria-label="拡大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button id="zoomReset" aria-label="拡大率を元に戻す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v4h4"/></svg><b id="zoomLabel">100%</b></button>
          <button id="zoomOut" aria-label="縮小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        </div>
        <!-- 選択ツールのときの操作 -->
        <div id="selBar" class="sel-bar hidden">
          <span class="sel-info"></span>
          <button data-sel="copy">コピー</button>
          <button data-sel="cut">切り取り</button>
          <button data-sel="paste">貼り付け</button>
          <button data-sel="del">削除</button>
          <button data-sel="branch">分岐</button>
          <button data-sel="clear">解除</button>
          <button data-sel="adopt" class="hidden">本譜面へ</button>
        </div>
      </div>
      <div id="flyMenu" class="div-menu fly-menu hidden" role="menu"></div>
      <!-- メニュー（編集・ファイル・再生のタブと、アイコンのタイル） -->
      <div id="menuPanel" class="menu-panel hidden" role="menu"></div>
      <nav class="side">
        <button id="btnHome" title="曲選択へ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h6l2 2h10v10H3z"/></svg></button>
        <button id="btnUndo" title="元に戻す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button id="btnRedo" title="やり直し"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        <!-- メニュー: 編集・ファイル・再生をまとめたパネルを出す -->
        <button id="btnMenu" title="メニュー"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <button id="btnRate" class="ratebtn" title="再生速度"><b id="rateLabel">1.0x</b></button>
        <button id="btnTest" data-fly="test" title="テストプレイ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
        <button id="btnSettings" title="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
      </nav>
    </div>


    <!-- 最初の画面（曲選択）: 左にフォルダ、真ん中に曲の一覧、右に選んだ曲（src/home/home.ts） -->
    <div id="home" class="home hidden">
      <div class="home-bg" aria-hidden="true"></div>
      <aside class="home-nav">
        <h1 class="home-logo"><img src="logo.png" alt="TJAtelier" draggable="false"></h1>
        <div id="homeFolders" class="home-folders"></div>
        <div class="home-navb">
          <button data-h="import" title="読み込み" aria-label="読み込み"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/></svg></button>
          <button data-h="new" title="新しい譜面" aria-label="新しい譜面"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button>
          <button data-h="online" title="オンライン対戦" aria-label="オンライン対戦"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5s1.2-6.1 3.8-8.5z"/></svg></button>
          <button data-h="settings" title="設定" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
        </div>
      </aside>
      <section class="home-mid">
        <div class="home-mh">
          <b id="homePath">すべて</b><small id="homeCount">0</small>
          <span class="sp"></span>
          <button data-h="pick" id="homePickBtn" class="home-pickbtn" title="選択"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h3M4 12h3M4 18h3"/><path d="M10 6h10M10 12h10M10 18h10"/></svg><small>選択</small></button>
          <button data-h="sort" class="home-sort" title="並べ替え"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h11M4 17h6"/></svg><small id="homeSort">更新順</small></button>
          <button data-h="search" title="検索" aria-label="検索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg></button>
        </div>
        <div id="homeSearch" class="home-search hidden"><input id="homeQuery" type="search" placeholder="" autocomplete="off"></div>
        <div id="homeList" class="home-list"></div>
        <!-- 曲を選んでいるときの操作 -->
        <div id="homePick" class="home-pick hidden"></div>
      </section>
      <!-- 難易度えらび（まんなかの曲をもう一度タップ・「この曲にする」） -->
      <div id="homeDiff" class="home-diff hidden"></div>
    </div>

    <div id="sheet" class="sheet hidden">
      <div class="sheet-panel">
        <div class="sheet-head">
          <div class="sheet-title">
            <h2 id="sheetTitle"></h2>
            <button id="sheetBold" class="bold-toggle" aria-label="太字の切り替え" aria-pressed="false">B</button>
          </div>
          <button id="sheetClose" class="icon" aria-label="閉じる">×</button>
        </div>
        <div id="sheetBody" class="sheet-body"></div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- 処理中（.ogg への変換など） -->
    <div id="busy" class="busy hidden"><div class="busy-panel"><i class="busy-spin"></i><p id="busyMsg"></p><div class="busy-bar"><i id="busyBar"></i></div></div></div>

    <!-- iPhone では accept に .tja を書くと選べなくなるので拡張子の制限はしない -->
    <input type="file" id="fileOpen" multiple hidden />

    <div id="play" class="play hidden">
      <canvas id="game"></canvas>
      <button id="playPause" class="icon pause" aria-label="ポーズ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
      <div id="pauseMenu" class="pause-menu hidden">
        <div class="panel pm">
          <div class="pm-main">
            <h2>ポーズ</h2>
            <button id="pauseResume" class="primary">つづける</button>
            <button id="pauseRetry">やりなおす</button>
            <button id="pauseRestart">はじめから</button>
            <button id="pauseBack">エディタへ</button>
          </div>
          <div class="pm-set" id="pauseSettings"></div>
        </div>
      </div>
    </div>

    <div id="result" class="res hidden">
      <div class="res-bg" aria-hidden="true">
        <svg class="res-obj" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMax slice">
          <defs><linearGradient id="resM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="m1"/><stop offset="1" class="m2"/></linearGradient>
<radialGradient id="resF" cx="0.42" cy="0.35" r="0.75"><stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs>

          <!-- 斜めの光の柱 -->
          <g class="shaft"><path d="M380 0 h90 l-80 560 h-90 z"/><path d="M520 0 h40 l-80 560 h-40 z"/><path d="M930 0 h120 l-80 560 h-120 z"/></g>
          <!-- 斜めの面（UI の平行四辺形と同じ傾き） -->
          <g class="shards" transform="translate(-20 -70)"><path class="s-out" d="M638.7 40 H968.7 L890.0 600 H560 Z"/><path class="s-main" d="M673.1 90 H1003.1 L930.0 610 H600 Z"/><path class="s-hl" d="M673.1 90 H1003.1 L930.0 610 H600 Z"/><path class="s-sub" d="M517.8 250 H637.8 L590.0 590 H470 Z"/><path class="s-sub" d="M1009.0 170 H1079.0 L1020.0 590 H950 Z"/><path class="s-thin" d="M963.1 60 H987.1 L914.0 580 H890 Z"/><path class="s-thin" d="M586.2 180 H598.2 L542.0 580 H530 Z"/><path class="s-line" d="M640.8 130 H890.8 L890.0 136 H640 Z"/><path class="s-line" d="M625.8 230 H875.8 L875.0 236 H625 Z"/><path class="s-line" d="M610.8 330 H860.8 L860.0 336 H610 Z"/></g>
        </svg>
        <div class="res-fw"><i></i><i></i><i></i><i></i></div>
      </div>
      <header class="res-top"><b class="res-title"></b><span class="res-sub"></span></header>
      <div class="res-main">
        <section class="res-card">
          <div class="res-head"><span class="res-course"></span><div class="res-gauge"><i></i><em></em><u></u></div></div>
          <div class="res-body">
            <div class="res-left">
              <div class="res-score"><small>スコア</small><b id="resScore">0</b><span class="res-best">自己ベスト更新</span></div>
              <div class="res-crowns"><span class="res-crown"></span><span class="res-acc"></span></div>
            </div>
            <ul class="res-counts">
              <li class="good"><span>良</span><b data-c="good">0</b></li>
              <li class="ok"><span>可</span><b data-c="ok">0</b></li>
              <li class="bad"><span>不可</span><b data-c="bad">0</b></li>
              <li><span>連打数</span><b data-c="rolls">0</b></li>
              <li><span>最大コンボ数</span><b data-c="maxCombo">0</b></li>
            </ul>
          </div>
        </section>
        <section class="res-side">
          <h2 class="res-h">結果</h2>
          <div class="calib hidden">
            <button id="applyCalib"></button>
          </div>
          <div class="calib edgehint hidden">
            <button id="growFace"></button>
          </div>
          <dl class="res-dl"></dl>
          <div class="buttons">
            <button id="retry" class="primary">もう一度</button>
            <button id="back">エディタへ戻る</button>
          </div>
        </section>
      </div>
    </div>

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
