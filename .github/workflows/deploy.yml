name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # package-lock.json のとおりに入れる（依存を変えたら「package-lock.json を作り直す」を動かす）
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      # 拍の AI（Beat This! small0）を動かす onnxruntime-web（MIT）を、公開するサイトの ai/ に入れる（モデルは public/ai にある）。
      # 取れなかったときは AI なしで公開する（測るときは、これまでの測り方だけになる）
      - name: 拍の AI の実行環境を入れる
        if: github.ref == 'refs/heads/main'
        run: |
          ( cd /tmp && npm pack onnxruntime-web@1.21.0 --silent && tar -xzf onnxruntime-web-1.21.0.tgz ) || { echo "::warning::onnxruntime-web を取れませんでした"; exit 0; }
          cp /tmp/package/dist/ort.wasm.min.mjs /tmp/package/dist/ort-wasm-simd-threaded.mjs /tmp/package/dist/ort-wasm-simd-threaded.wasm dist/ai/
          cp /tmp/package/dist/ort.webgpu.min.mjs /tmp/package/dist/ort-wasm-simd-threaded.jsep.mjs /tmp/package/dist/ort-wasm-simd-threaded.jsep.wasm dist/ai/ || echo "::warning::GPU 用の実行環境を取れませんでした"
          cp /tmp/package/LICENSE* dist/ai/LICENSE-onnxruntime.txt 2>/dev/null || curl -fsSL -o dist/ai/LICENSE-onnxruntime.txt "https://raw.githubusercontent.com/microsoft/onnxruntime/main/LICENSE" || true
          ls -la dist/ai
      - name: 音源分離の AI を入れる
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --depth 1 origin ai-models || { echo "::warning::ai-models の枝を取れませんでした"; exit 0; }
          for f in $(git ls-tree --name-only FETCH_HEAD | grep -E '^htdemucs-s20(-fp16)?\.onnx(\.part[0-9])?$'); do git show "FETCH_HEAD:$f" > "dist/ai/$f"; done
          python3 - <<'PY'
          import json, os, re
          d = 'dist/ai'
          out = {}
          for kind, stem, length in (('fp16', 'htdemucs-s20-fp16.onnx', 88200), ('fp32', 'htdemucs-s20.onnx', 88200)):
              parts = sorted([f for f in os.listdir(d) if f == stem or re.fullmatch(re.escape(stem) + r'\.part\d', f)])
              if parts:
                  out[kind] = {'parts': parts, 'sizes': [os.path.getsize(f'{d}/{f}') for f in parts], 'length': length}
          json.dump(out, open(f'{d}/demucs.json', 'w'))
          print(out)
          PY
          printf '%s\n' 'htdemucs-s20-fp16.onnx (weights half precision, overflow-prone ops kept in float32), list: demucs.json' '' 'HTDemucs (Meta, MIT license, https://github.com/facebookresearch/demucs), 2-second segment,' \
            'exported to ONNX by tools/ai-export/export.py. Inputs: mix [1,2,88200], mag [1,4,2048,87].' > dist/ai/README-demucs.txt
          curl -fsSL -o dist/ai/LICENSE-demucs.txt https://raw.githubusercontent.com/facebookresearch/demucs/main/LICENSE || true
          ls -la dist/ai
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
