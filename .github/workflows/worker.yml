name: オンライン対戦サーバーを配信

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: ライブラリを入れる
        run: npm install --no-audit --no-fund

      - name: アカウントの確認
        run: |
          npx wrangler whoami
          ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log((j.result&&j.result[0]&&j.result[0].id)||"")})')
          echo "account: ${ACC:0:6}…"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain")
          echo "subdomain: $SUB"
          echo "::notice title=workers.dev::$(echo "$SUB" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result.subdomain||"(なし)")}catch{console.log("(不明)")}})')"

      - name: 配信
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          echo "::notice title=Worker URL::${URL:-見つかりません}"

      - name: 動作確認
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          sleep 5
          echo "::notice title=GET /rooms::$(curl -s "$URL/rooms")"
          # 部屋を作って、もう 1 人が入り、予約できるか。'ping' に眠ったまま 'pong' が返るか。
          # 30 秒だれも送らずに（サーバーが眠ってから）チャットを送り、部屋の様子が戻っているかを確かめる
          node -e '
            const base = process.argv[1].replace(/^http/, "ws");
            const id = "T" + Math.random().toString(36).slice(2, 7).toUpperCase().replace(/[^A-Z0-9]/g, "X");
            const out = [];
            const done = (ok, m) => { console.log((ok ? "::notice" : "::error") + " title=WebSocket::" + m + " / " + out.join(" ")); process.exit(ok ? 0 : 1); };
            setTimeout(() => done(false, "timeout"), 60000);
            const a = new WebSocket(`${base}/ws/${id}?name=check&create=1&title=check&cid=ca`);
            let b = null;
            let pong = false;
            let reserved = false;
            let slept = false;
            const meta = { title: "check", subtitle: "", course: "Oni", level: 1, tja: "x".repeat(600000), size: 0, audioName: "", hash: "", lib: "", vname: "", vsize: 0, vhash: "", voff: 0, vfromAudio: false };
            a.onmessage = (e) => {
              if (e.data === "pong") { pong = true; out.push("A:pong"); return; }
              const m = JSON.parse(e.data); out.push("A:" + m.t);
              if (m.t === "hello") {
                b = new WebSocket(`${base}/ws/${id}?name=check2&cid=cb`);
                b.onmessage = (e2) => {
                  if (e2.data === "pong") return;
                  const n = JSON.parse(e2.data); out.push("B:" + n.t);
                  if (n.t === "roster" && n.players.length === 2 && !reserved) {
                    reserved = true;
                    a.send("ping");
                    b.send(JSON.stringify({ t: "reserve", meta }));
                  }
                  if (n.t === "next") setTimeout(() => b.send(JSON.stringify({ t: "chat", x: "after-sleep" })), 30000);
                };
              }
              if (m.t === "chat" && m.x === "after-sleep") {
                if (!pong) return done(false, "no pong");
                slept = true;
                a.send(JSON.stringify({ t: "ok", on: true }));
              }
              if (slept && m.t === "roster") {
                if (m.players.length === 2 && m.song && m.song.title === "check") done(true, "ok");
                else done(false, "state lost " + JSON.stringify(m.song));
              }
            };
            a.onerror = () => done(false, "error");
          ' "$URL"

      - name: 合作サーバーの動作確認
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          # 部屋を作り（あいことば）、一覧に出るか。もう 1 人があいことばで入って変更が届くか。音源を置いて受け取れるか
          node -e '
            const http = process.argv[1];
            const base = http.replace(/^http/, "ws");
            const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            const id = Array.from({ length: 6 }, () => A[Math.floor(Math.random() * A.length)]).join("");
            const out = [];
            const done = (ok, m) => { console.log((ok ? "::notice" : "::error") + " title=合作::" + m + " / " + out.join(" ")); process.exit(ok ? 0 : 1); };
            setTimeout(() => done(false, "timeout"), 30000);
            const a = new WebSocket(`${base}/collab/ws/${id}?cid=ca&name=A&pass=check&create=1&rname=check&unlisted=1`);
            a.onmessage = async (e) => {
              if (e.data === "pong") return;
              const m = JSON.parse(e.data); out.push("A:" + m.t);
              if (m.t !== "ready") return;
              const bytes = new Uint8Array(1500000).map((_, i) => i % 7);
              const put = await fetch(`${http}/collab/audio/${id}/abcd1234?cid=ca`, { method: "PUT", body: bytes });
              out.push("put:" + put.status);
              const got = new Uint8Array(await (await fetch(`${http}/collab/audio/${id}/abcd1234?cid=ca`)).arrayBuffer());
              out.push("get:" + got.byteLength);
              if (got.byteLength !== bytes.byteLength || got[1234567] !== 1234567 % 7) return done(false, "audio");
              const listed = await (await fetch(`${http}/collab/rooms?ids=${id}`)).json();
              out.push("rooms:" + listed.length);
              if (!listed.length) return done(false, "not listed");
              const b = new WebSocket(`${base}/collab/ws/${id}?cid=cb&name=B&pass=check`);
              b.onmessage = (e2) => {
                const n = JSON.parse(e2.data); out.push("B:" + n.t);
                if (n.t === "ready") a.send(JSON.stringify({ t: "ops", c: 1, ops: [{ o: "m", v: { title: "check" } }] }));
                if (n.t === "ops" && n.ops[0].v.title === "check") done(true, "ok");
              };
            };
            a.onerror = () => done(false, "error");
          ' "$URL"
