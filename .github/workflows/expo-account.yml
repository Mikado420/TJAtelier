name: Expo のアカウントを確かめる

on:
  workflow_dispatch:

jobs:
  view:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: アカウントと組織
        run: |
          npx --yes eas-cli@latest account:view 2>&1 | tee out.txt
          while IFS= read -r line; do [ -n "$line" ] && echo "::notice title=account::$line"; done < out.txt
