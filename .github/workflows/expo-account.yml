name: Expo のアカウントを確かめる

on:
  workflow_dispatch:

jobs:
  view:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: アカウントと組織
        run: |
          for q in '{ meActor { __typename accounts { name } } }' '{ viewer { username accounts { name } } }' '{ meUserActor { username accounts { name } } }'; do
            body=$(node -e 'console.log(JSON.stringify({query: process.argv[1]}))' "$q")
            out=$(curl -sS https://api.expo.dev/graphql -H "Authorization: Bearer $EXPO_TOKEN" -H 'content-type: application/json' -d "$body" | head -c 600)
            echo "$out"
            echo "::notice title=account::$out"
          done
