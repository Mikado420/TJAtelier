name = "tjatelier-online"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "COLLAB_ROOM"
class_name = "CollabRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Collab"]

# 合作の部屋をすべて片付ける（Collab の中身ごと消して、新しい CollabRoom にする）
[[migrations]]
tag = "v3"
new_sqlite_classes = ["CollabRoom"]

[[migrations]]
tag = "v4"
deleted_classes = ["Collab"]
